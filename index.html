<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STOC Inc. // APEX CURVED PERFORMANCE CLUSTER</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main id="cockpit" class="theme-amber engine-off" aria-label="STOC Inc. Apex Performance Cluster">

    <!-- PENGATURAN HUD & MUSIC PLAYER -->
    <div id="settingsMenu">
      <div class="settings-heading">
        <span class="settings-dot"></span>
        <span>STOC TUNING CONFIG</span>
        <button id="closeSettings" class="icon-button" type="button" aria-label="Tutup pengaturan">×</button>
      </div>

      <div class="menu-btns">
        <button type="button" data-act="resize">Resize</button>
        <button type="button" data-act="move">Pindah</button>
        <button type="button" data-act="reset">Reset</button>
        <button type="button" data-act="theme">Theme</button>
      </div>

      <!-- PEMUTAR MUSIK YOUTUBE -->
      <section id="music-panel" class="music-panel no-drag" aria-label="Online Music Player">
        <div class="music-now-playing">
          <div class="music-video-wrap">
            <div id="youtube-player"></div>
            <img id="music-cover" class="music-cover" alt="" aria-hidden="true">
            <div id="music-player-placeholder" class="music-placeholder">
              <span class="music-placeholder-note" aria-label="Music">♪</span>
            </div>
          </div>
          <div class="music-track-meta">
            <div id="music-track-title">Belum ada lagu</div>
            <div id="music-track-subtitle">Online playback</div>
          </div>
        </div>

        <div class="music-progress-row">
          <span id="music-current-time">0:00</span>
          <input id="music-progress" class="music-range" type="range" min="0" max="1000" value="0" step="1" aria-label="Song progress">
          <span id="music-duration">0:00</span>
        </div>

        <div class="music-main-controls">
          <button id="btn-music-prev" class="music-control-btn" type="button" title="Previous">⏮</button>
          <button id="btn-music-play" class="music-play-btn" type="button" title="Play / Pause">▶</button>
          <button id="btn-music-next" class="music-control-btn" type="button" title="Next">⏭</button>
        </div>

        <div class="music-volume-row">
          <button id="btn-music-mute" class="music-icon-btn" type="button" title="Mute">🔊</button>
          <input id="music-volume" class="music-range" type="range" min="0" max="100" value="80" step="1" aria-label="Volume">
          <button id="btn-music-add-toggle" class="music-small-btn music-add-toggle" type="button" title="Tambah lagu">＋</button>
        </div>

        <div id="music-add-row" class="music-add-row hide">
          <input id="music-url-input" type="text" placeholder="Link YouTube / ID Video" autocomplete="off">
          <input id="music-title-input" type="text" placeholder="Nama lagu (opsional)" autocomplete="off">
          <button id="btn-music-add" class="music-small-btn music-add-primary" type="button">▶</button>
        </div>

        <div class="music-tools-row">
          <button id="btn-music-repeat" class="music-tool-btn" type="button" title="Ulangi lagu">↻</button>
          <button id="btn-music-shuffle" class="music-tool-btn" type="button" title="Putar acak">⤨</button>
        </div>

        <div class="music-playlist-head">
          <span>Playlist</span>
          <button id="btn-music-clear" class="music-text-btn" type="button" title="Kosongkan playlist">×</button>
        </div>
        <div id="music-playlist" class="music-playlist" role="list">
          <div class="music-empty">Playlist kosong. Tekan + untuk menambah lagu.</div>
        </div>
      </section>

      <div id="settingsHint">Klik kanan untuk menutup menu</div>
      <div class="settings-footer">
        <span>STOC Inc. WORKSHOP</span>
        <span>APEX CLUSTER</span>
      </div>
    </div>

    <!-- LAPISAN 1: HOUSING CARBON MELENGKUNG + DIAL TACHOMETER (statis) -->
    <svg id="clusterBase" class="layer" viewBox="0 0 640 304" aria-hidden="true">
      <defs>
        <pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse">
          <rect width="8" height="8" fill="#0f1115"/>
          <rect width="4" height="4" fill="#181b21"/>
          <rect x="4" y="4" width="4" height="4" fill="#181b21"/>
          <path d="M0 0L8 8M8 0L0 8" stroke="#0a0b0e" stroke-width=".6" opacity=".6"/>
        </pattern>
        <linearGradient id="housingSheen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
          <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".45"/>
        </linearGradient>
        <linearGradient id="alu" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a7aeb5"/>
          <stop offset=".3" stop-color="#5a626a"/>
          <stop offset=".55" stop-color="#2a2f35"/>
          <stop offset=".8" stop-color="#6d757d"/>
          <stop offset="1" stop-color="#9aa1a8"/>
        </linearGradient>
        <linearGradient id="trim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8b939a"/>
          <stop offset="1" stop-color="#3b4147"/>
        </linearGradient>
        <radialGradient id="faceGrad" cx=".5" cy=".42" r=".65">
          <stop offset="0" stop-color="#1b1e25"/>
          <stop offset=".7" stop-color="#0b0c10"/>
          <stop offset="1" stop-color="#040508"/>
        </radialGradient>
        <radialGradient id="dialLight" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="rgb(var(--hud-rgb))" stop-opacity=".30"/>
          <stop offset=".6" stop-color="rgb(var(--hud-rgb))" stop-opacity=".08"/>
          <stop offset="1" stop-color="rgb(var(--hud-rgb))" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="boltGrad" cx=".4" cy=".35" r=".7">
          <stop offset="0" stop-color="#c3c9ce"/>
          <stop offset="1" stop-color="#3a4046"/>
        </radialGradient>
        <g id="bolt">
          <polygon points="0,-6 5.2,-3 5.2,3 0,6 -5.2,3 -5.2,-3" fill="url(#boltGrad)" stroke="#14171b" stroke-width="1"/>
          <polygon points="0,-3 2.6,-1.5 2.6,1.5 0,3 -2.6,1.5 -2.6,-1.5" fill="#101215" stroke="#6b737a" stroke-width=".6"/>
        </g>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
          <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".6"/>
        </filter>
      </defs>

      <!-- Bodi klaster: pod sayap miring + kubah tacho (di luar lengkungan transparan) -->
      <path id="housingPath" filter="url(#softShadow)" fill="url(#carbon)" stroke="url(#alu)" stroke-width="3"
        d="M8 116 C8 108 12 104 20 102 C90 90 150 78 206 58 C240 20 290 8 330 8 C370 8 420 20 454 58 C510 78 570 90 620 102 C628 104 632 108 632 116 L628 208 C628 220 622 226 612 228 C560 236 508 240 458 252 C440 286 390 300 330 300 C270 300 220 286 202 252 C152 240 100 236 48 228 C38 226 12 220 12 208 Z"/>
      <path d="M8 116 C8 108 12 104 20 102 C90 90 150 78 206 58 C240 20 290 8 330 8 C370 8 420 20 454 58 C510 78 570 90 620 102 C628 104 632 108 632 116 L628 208 C628 220 622 226 612 228 C560 236 508 240 458 252 C440 286 390 300 330 300 C270 300 220 286 202 252 C152 240 100 236 48 228 C38 226 12 220 12 208 Z" fill="url(#housingSheen)"/>
      <!-- Garis aksen swept wing -->
      <path d="M22 112 C92 100 152 88 212 68" fill="none" stroke="#5a626a" stroke-width="1.2" opacity=".7"/>
      <path d="M618 112 C548 100 488 88 448 68" fill="none" stroke="#5a626a" stroke-width="1.2" opacity=".7"/>
      <path d="M40 218 C100 224 156 230 206 244" fill="none" stroke="#5a626a" stroke-width="1" opacity=".5"/>
      <path d="M600 218 C540 224 484 230 454 244" fill="none" stroke="#5a626a" stroke-width="1" opacity=".5"/>

      <!-- Baut hex counter-sunk -->
      <use href="#bolt" transform="translate(30 124)"/>
      <use href="#bolt" transform="translate(30 208)"/>
      <use href="#bolt" transform="translate(610 124)"/>
      <use href="#bolt" transform="translate(610 208)"/>
      <use href="#bolt" transform="translate(206 262)"/>
      <use href="#bolt" transform="translate(454 262)"/>

      <!-- Trim ring aluminium anodized -->
      <circle cx="330" cy="154" r="120" fill="#06070a" stroke="#000" stroke-width="2" opacity=".85"/>
      <circle cx="330" cy="154" r="116" fill="none" stroke="url(#alu)" stroke-width="9"/>
      <circle cx="330" cy="154" r="111" fill="none" stroke="#14171b" stroke-width="1.5"/>
      <circle cx="330" cy="154" r="120.5" fill="none" stroke="#9aa1a8" stroke-width=".8" opacity=".6"/>

      <!-- Wajah dial -->
      <circle cx="330" cy="154" r="110" fill="url(#faceGrad)"/>
      <circle class="backlight" cx="330" cy="154" r="110" fill="url(#dialLight)"/>
      <circle class="perimeter" cx="330" cy="154" r="109" fill="none" stroke="#ff2a1a" stroke-width="5"/>

      <!-- Skala tachometer 0 - 9000 RPM (diisi oleh script.js) -->
      <g id="dialMarks" class="face-lit"></g>

      <!-- Poros metal bingkai logo -->
      <circle cx="330" cy="154" r="32" fill="url(#alu)" stroke="#0a0b0e" stroke-width="1.5"/>
      <circle cx="330" cy="154" r="28" fill="#08090c" stroke="url(#trim)" stroke-width="2"/>

      <!-- Shift light LED bertingkat -->
      <g id="shiftLights">
        <circle id="led0" class="led g" cx="278" cy="37" r="5"/>
        <circle id="led1" class="led g" cx="303.4" cy="29" r="5"/>
        <circle id="led2" class="led y" cx="330" cy="26" r="5"/>
        <circle id="led3" class="led r" cx="356.6" cy="29" r="5"/>
        <circle id="led4" class="led r" cx="382" cy="37" r="5"/>
      </g>

      <!-- Badge laser-engraved STOC Inc. -->
      <g>
        <rect x="270" y="274" width="120" height="19" rx="3" fill="url(#trim)" stroke="#14171b" stroke-width="1"/>
        <rect x="272.5" y="276.5" width="115" height="14" rx="2" fill="#15181d"/>
        <text x="330" y="287.5" text-anchor="middle" class="badge-text">STOC Inc.</text>
      </g>
    </svg>

    <!-- Logo bengkel di poros dial + backlight -->
    <div class="logo-glow face-lit"></div>
    <img id="clusterLogo" src="logo.png" alt="STOC Inc. Logo" class="cluster-logo">

    <!-- LAPISAN 3: JARUM RPM + KACA CEMBUNG -->
    <svg id="clusterNeedle" class="layer" viewBox="0 0 640 304" aria-hidden="true">
      <defs>
        <linearGradient id="needleGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd2a0"/>
          <stop offset=".25" stop-color="#ff4a1c"/>
          <stop offset="1" stop-color="#b21e05"/>
        </linearGradient>
        <radialGradient id="glassHi" cx=".35" cy=".18" r=".8">
          <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
          <stop offset=".45" stop-color="#fff" stop-opacity=".04"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="needleShadow" opacity=".55">
        <path d="M326.5 124 L333.5 124 L331 56 L330 50 L329 56 Z M327 184 L333 184 L332 192 L328 192 Z" fill="#000"/>
      </g>
      <g id="needle" transform="rotate(-135 330 154)">
        <path class="needle-body" d="M326.5 124 L333.5 124 L331 56 L330 50 L329 56 Z M327 184 L333 184 L332 192 L328 192 Z" fill="url(#needleGrad)"/>
      </g>
      <!-- Kaca cembung pelindung dial -->
      <circle cx="330" cy="154" r="109" fill="url(#glassHi)"/>
      <path d="M232 112 A104 104 0 0 1 330 50" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="5" stroke-linecap="round"/>
    </svg>

    <!-- Sein: panah minimalis di lengkung bezel atas -->
    <div id="leftIndicator" class="turn left" title="Sein kiri">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 14 L13 4 L13 10 L25 10 L25 18 L13 18 L13 24 Z"/></svg>
    </div>
    <div id="rightIndicator" class="turn right" title="Sein kanan">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M25 14 L15 4 L15 10 L3 10 L3 18 L15 18 L15 24 Z"/></svg>
    </div>

    <!-- Pembacaan kecepatan digital (kubah tengah bawah jarum) -->
    <div class="speed-wrap face-lit">
      <div id="speedValue">000</div>
      <span id="speedUnit">KM/H</span>
    </div>

    <!-- POD SAYAP KIRI: Fuel, Health, status -->
    <section class="pod left face-lit" aria-label="Fluid gauges">
      <div class="fluid" id="fuelGauge">
        <div class="fluid-head"><span>FUEL</span><b id="fuelValue">100%</b></div>
        <div class="fluid-bar"><i id="fuelFill"></i></div>
      </div>
      <div class="fluid health" id="healthGauge">
        <div class="fluid-head"><span>ENGINE</span><b id="healthValue">100%</b></div>
        <div class="fluid-bar"><i id="healthFill"></i></div>
      </div>
      <div class="status-icons">
        <div id="engineCheck" class="vehicle-indicator" title="Engine Check">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3l2-3h6l2 3h3v9h-3l-2 2H8l-2-2H4zM9 6V3h5v3M8 12h3m2 0h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </div>
        <div id="headlightIndicator" class="vehicle-indicator" title="Headlights">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h5a5 5 0 0 1 0 10H4zM13 8h7M13 12h8M13 16h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div id="seatbeltIndicator" class="vehicle-indicator" title="Seatbelt">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3l4 3-2 4 6 7 3-2 2 3-4 3-9-10 1-4-3-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </section>

    <!-- POD SAYAP KANAN: Gear billet, jam, odometer mekanik -->
    <section class="pod right face-lit" aria-label="Drive info">
      <div class="gear-box">
        <span id="gearValue" class="gear-big" title="Gear">N</span>
        <div id="gearStrip" class="gear-strip">
          <i data-g="P">P</i><i data-g="R">R</i><i data-g="N">N</i><i data-g="D">D</i>
          <i data-g="1">1</i><i data-g="2">2</i><i data-g="3">3</i><i data-g="4">4</i><i data-g="5">5</i><i data-g="6">6</i>
        </div>
      </div>
      <div class="clock"><span id="clockValue">00<em>:</em>00</span><small id="headlightMode">LIGHTS OFF</small></div>
      <div class="odo-row">
        <div id="odometerValue" class="odo-digits" aria-label="Odometer">0000000</div>
        <span class="odo-unit">KM</span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
